<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Cappello | Hats Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f8fafc;
            --text-main: #1e293b;
            --radius: 20px;
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
        }

        .header-section {
            padding: 3rem 0;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            border-radius: 0 0 var(--radius) var(--radius);
            margin-bottom: -60px;
        }

        .form-card {
            border: none;
            border-radius: var(--radius);
            background: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 2.5rem !important;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .input-group-text {
            background-color: #f8fafc;
            border-right: none;
            color: #94a3b8;
            border-radius: 12px 0 0 12px;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 12px 12px 0;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            border-color: var(--primary);
        }

        .btn-save {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: 700;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .btn-save:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-cancel {
            background-color: #f1f5f9;
            color: #64748b;
            border: none;
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 12px;
        }

        .btn-cancel:hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Anteprima Immagine */
        .current-img-preview {
            max-width: 120px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            margin-bottom: 10px;
        }
        .preview-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <header class="header-section text-center">
        <div class="container">
            <h1 class="fw-bold">Gestione Catalogo</h1>
            <p class="opacity-75">Aggiorna le informazioni del tuo pezzo da collezione</p>
        </div>
    </header>

    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">
                
                <div class="card form-card shadow">
                    <h2 class="section-title">
                        <i class="bi bi-pencil-square text-primary"></i> 
                        Modifica Dettagli Cappello
                    </h2>
                    
                    <form th:action="@{/edit/{id}(id=${cappello.id})}" th:object="${cappello}" method="post" enctype="multipart/form-data">
                        
                        <input type="hidden" th:field="*{immagine}">

                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label">Nome Modello</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-tag"></i></span>
                                    <input type="text" th:field="*{nome}" class="form-control" required placeholder="Es: Snapback Classic">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Marca</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-building"></i></span>
                                    <input type="text" th:field="*{marca}" class="form-control" required placeholder="Es: New Era">
                                </div>
                            </div>
                        </div>

                        <div class="row g-4 mt-2">
                            <div class="col-md-4">
                                <label class="form-label">Taglia</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-rulers"></i></span>
                                    <select th:field="*{taglia}" class="form-select">
                                        <option th:each="t : ${taglie}" th:value="${t}" th:text="${t}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Anno di produzione</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                                    <input type="number" th:field="*{anno}" class="form-control" min="1900" max="2026" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Prezzo (€)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-currency-euro"></i></span>
                                    <input type="number" step="0.01" th:field="*{prezzo}" class="form-control" min="0" required>
                                </div>
                            </div>
                        </div>

                        <div class="row g-4 mt-2">
                            <div class="col-12">
                                <label class="form-label">Immagine Prodotto</label>
                                
                                <div class="d-flex align-items-start gap-4 mb-3">
                                    <div th:if="${cappello.immagine != null and !cappello.immagine.isEmpty()}">
                                        <span class="preview-label">Attuale:</span>
                                        <img th:src="@{'/uploads/' + ${cappello.immagine}}" class="current-img-preview" alt="Foto Attuale">
                                    </div>
                                    
                                    <div id="new-preview-container" style="display: none;">
                                        <span class="preview-label text-primary">Nuova (Anteprima):</span>
                                        <img id="new-preview" src="#" class="current-img-preview" style="border-color: var(--primary);">
                                    </div>
                                </div>

                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-image"></i></span>
                                    <input type="file" name="file" class="form-control" accept="image/*" id="file-input">
                                </div>
                                <small class="text-muted">Lascia vuoto per mantenere l'immagine attuale.</small>
                            </div>
                        </div>
                        
                        <div class="mt-5 pt-4 border-top d-flex flex-column flex-md-row gap-3">
                            <button type="submit" class="btn btn-save shadow-sm">
                                <i class="bi bi-cloud-arrow-up me-2"></i> Salva Modifiche
                            </button>
                            <a th:href="@{/item/{id}(id=${cappello.id})}" class="btn btn-cancel">
                                Annulla
                            </a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-muted">
        <small>Sistema di Gestione Inventario v2.0</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Script per mostrare l'anteprima della nuova immagine caricata
        document.getElementById('file-input').onchange = function (evt) {
            const [file] = this.files;
            if (file) {
                const preview = document.getElementById('new-preview');
                const container = document.getElementById('new-preview-container');
                preview.src = URL.createObjectURL(file);
                container.style.display = 'block';
            }
        }
    </script>
</body>
</html>
