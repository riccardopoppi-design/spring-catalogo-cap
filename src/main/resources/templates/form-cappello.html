<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Cappello | Hats Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --success-custom: #10b981;
            --bg-body: #f8fafc;
            --text-main: #1e293b;
            --radius: 20px;
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
        }

        .header-section {
            padding: 3rem 0;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            border-radius: 0 0 var(--radius) var(--radius);
            margin-bottom: -60px;
        }

        .form-card {
            border: none;
            border-radius: var(--radius);
            background: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 2.5rem !important;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .input-group-text {
            background-color: #f8fafc;
            border-right: none;
            color: #94a3b8;
            border-radius: 12px 0 0 12px;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 12px 12px 0;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            border-color: var(--primary);
        }

        .btn-save {
            background-color: var(--success-custom);
            color: white;
            border: none;
            font-weight: 700;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .btn-save:hover {
            background-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-cancel {
            background-color: #f1f5f9;
            color: #64748b;
            border: none;
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 12px;
        }

        .btn-cancel:hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bg-icon-new {
            width: 45px;
            height: 45px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-custom);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* Anteprima Immagine */
        #preview-container {
            display: none;
            margin-top: 15px;
            text-align: center;
        }
        #image-preview {
            max-width: 150px;
            max-height: 150px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 2px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <header class="header-section text-center">
        <div class="container">
            <h1 class="fw-bold">Aggiungi al Catalogo</h1>
            <p class="opacity-75">Inserisci un nuovo pezzo unico nella tua collezione</p>
        </div>
    </header>

    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">
                
                <div class="card form-card">
                    <div class="section-title">
                        <div class="bg-icon-new">
                            <i class="bi bi-plus-circle-fill"></i>
                        </div>
                        Nuovo Cappello
                    </div>
                    
                    <form th:action="@{/new}" th:object="${cappello}" method="post" enctype="multipart/form-data">
                        
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label">Nome Modello</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-alphabet-uppercase"></i></span>
                                    <input type="text" th:field="*{nome}" class="form-control" required placeholder="Es: Snapback Classic">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Marca</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-patch-check"></i></span>
                                    <input type="text" th:field="*{marca}" class="form-control" required placeholder="Es: New Era">
                                </div>
                            </div>
                        </div>

                        <div class="row g-4 mt-2">
                            <div class="col-md-4">
                                <label class="form-label">Taglia</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                                    <select th:field="*{taglia}" class="form-select">
                                        <option th:each="t : ${taglie}" th:value="${t}" th:text="${t}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Anno di produzione</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-calendar3"></i></span>
                                    <input type="number" th:field="*{anno}" class="form-control" min="1900" max="2026" required value="2024">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Prezzo (€)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-cash-stack"></i></span>
                                    <input type="number" step="0.01" th:field="*{prezzo}" class="form-control" min="0" required placeholder="0.00">
                                </div>
                            </div>
                        </div>

                        <div class="row g-4 mt-2">
                            <div class="col-12">
                                <label class="form-label">Foto del Cappello</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-image"></i></span>
                                    <input type="file" name="file" class="form-control" accept="image/*" id="file-input">
                                </div>
                                <div id="preview-container">
                                    <p class="small text-muted mt-2 mb-1">Anteprima:</p>
                                    <img id="image-preview" src="#" alt="Anteprima">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-5 pt-4 border-top d-flex flex-column flex-md-row gap-3">
                            <button type="submit" class="btn btn-save shadow-sm">
                                <i class="bi bi-check-lg me-2"></i> Salva nel Catalogo
                            </button>
                            <a href="/" class="btn btn-cancel">
                                <i class="bi bi-x-circle me-2"></i> Annulla
                            </a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-muted">
        <small>&copy; 2026 Hats Gallery • Gestione Catalogo</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.getElementById('file-input').onchange = function (evt) {
            const [file] = this.files;
            if (file) {
                const preview = document.getElementById('image-preview');
                const container = document.getElementById('preview-container');
                preview.src = URL.createObjectURL(file);
                container.style.display = 'block';
            }
        }
    </script>
</body>
</html>
