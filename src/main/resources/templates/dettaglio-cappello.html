<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Cappello | Hats Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f8fafc;
            --text-main: #1e293b;
            --radius: 20px;
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
        }

        .header-section {
            padding: 2.5rem 0;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            border-radius: 0 0 var(--radius) var(--radius);
            margin-bottom: -50px;
        }

        .detail-card {
            border: none;
            border-radius: var(--radius);
            background: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Styling Immagine: Intera e non tagliata */
        .detail-image-wrapper {
            background-color: #f1f5f9; /* Sfondo neutro per le parti non coperte dall'img */
            border-radius: 15px;
            overflow: hidden;
            height: 400px; /* Altezza fissa per coerenza */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .detail-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* L'immagine viene mostrata interamente */
            border-radius: 8px;
        }

        .info-label {
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .price-badge {
            background-color: #eef2ff;
            color: var(--primary);
            font-size: 2rem;
            font-weight: 800;
            padding: 0.8rem 1.5rem;
            border-radius: 15px;
            display: inline-block;
        }

        .btn-back {
            background-color: #f1f5f9;
            color: #475569;
            border: none;
            font-weight: 600;
            border-radius: 12px;
            padding: 0.8rem 1.5rem;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background-color: #e2e8f0;
        }

        .id-code {
            font-family: monospace;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            color: #64748b;
            font-size: 0.8rem;
        }

        .icon-box {
            width: 38px;
            height: 38px;
            background: #f8fafc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            margin-right: 12px;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <header class="header-section text-center">
        <div class="container pb-5">
            <h1 class="fw-bold">Scheda Prodotto</h1>
            <p class="opacity-75">Dettagli completi del pezzo in collezione</p>
        </div>
    </header>

    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                
                <div class="detail-card p-4 p-md-5">
                    <div class="row g-5">
                        
                        <div class="col-md-6">
                            <div class="detail-image-wrapper">
                                <img th:if="${cappello.immagine != null and !cappello.immagine.isEmpty()}" 
                                     th:src="@{'/uploads/' + ${cappello.immagine}}" 
                                     class="detail-image" 
                                     alt="Foto Cappello">
                                
                                <img th:unless="${cappello.immagine != null and !cappello.immagine.isEmpty()}" 
                                     src="https://images.unsplash.com/photo-1588850561407-ed78c282e89b?q=80&w=600&auto=format&fit=crop" 
                                     class="detail-image" 
                                     alt="Placeholder">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="mb-4">
                                <span class="badge mb-2 px-3 py-2" style="background: var(--primary); border-radius: 30px;" th:text="${cappello.marca}">Marca</span>
                                <h2 class="display-5 fw-bold mb-1" th:text="${cappello.nome}">Nome Cappello</h2>
                                <p class="text-muted small">ID Collezione: <span class="id-code" th:text="${cappello.id}"></span></p>
                            </div>

                            <div class="mb-4">
                                <div class="price-badge">
                                    <span th:text="${cappello.prezzo}"></span> €
                                </div>
                            </div>

                            <div class="row g-4 mb-5">
                                <div class="col-12">
                                    <div class="d-flex align-items-center mb-3">
                                        <div class="icon-box"><i class="bi bi-rulers"></i></div>
                                        <div>
                                            <div class="info-label">Taglia</div>
                                            <div class="info-value" th:text="${cappello.taglia}">XL</div>
                                        </div>
                                    </div>
                                    <div class="d-flex align-items-center mb-3">
                                        <div class="icon-box"><i class="bi bi-calendar-check"></i></div>
                                        <div>
                                            <div class="info-label">Anno di Produzione</div>
                                            <div class="info-value" th:text="${cappello.anno}">2023</div>
                                        </div>
                                    </div>
                                    <div class="d-flex align-items-center">
                                        <div class="icon-box"><i class="bi bi-shield-check"></i></div>
                                        <div>
                                            <div class="info-label">Stato Oggetto</div>
                                            <div class="info-value">In Catalogo</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="border-top pt-4 d-flex gap-3">
                                <a href="/" class="btn btn-back d-inline-flex align-items-center justify-content-center">
                                    <i class="bi bi-arrow-left me-2"></i> Torna Indietro
                                </a>
                                <a th:href="@{/edit/{id}(id=${cappello.id})}" 
                                class="btn btn-primary flex-grow-1 d-inline-flex align-items-center justify-content-center">
                                    <i class="bi bi-pencil-square me-2"></i> Modifica
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
